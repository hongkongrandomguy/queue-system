<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Take Ticket 取號</title><link rel="stylesheet" href="css/style.css">
</head><body>
<div class="topbar"><span id="sysTitle"></span><span class="chip" id="sessChip"></span></div>
<div class="center" style="min-height:78vh;gap:24px">
  <div class="row" style="justify-content:center">
    <div class="card center" style="min-width:240px">
      <div class="muted">Waiting Now 現時輪候</div>
      <div id="waitCount" style="font-size:56px;font-weight:800;color:#38bdf8">0</div>
      <div class="muted">tickets 籌</div>
    </div>
    <div class="card center" style="min-width:240px">
      <div class="muted">Est. Waiting Time 預計等候時間</div>
      <div id="waitTime" style="font-size:56px;font-weight:800;color:#facc15">—</div>
      <div class="muted">minutes 分鐘</div>
    </div>
  </div>
  <button id="takeBtn">TAKE<br>A TICKET<span class="hk" style="display:block;font-size:28px;color:#dbeafe">請按此取號</span></button>
  <div id="result" class="card center" style="display:none">
    <div class="muted">Your Ticket Number 你的籌號</div>
    <div id="newTicket">A001</div>
    <div id="note" class="muted"></div>
  </div>
</div>
<div id="printArea"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/config.js"></script><script src="js/common.js"></script>
<script>
let busy=false;
onState(s=>{
  document.getElementById('sessChip').textContent=`Session 時段 ${s.session.prefix}`;
  document.getElementById('sysTitle').innerHTML=`${s.settings.title} <span class="hk">${s.settings.subtitle}</span>`;
  const w=waiting().length;
  document.getElementById('waitCount').textContent=w;
  const avg=s.settings.avgMinutes||3;
  const n=(s.settings.counters||[]).length||1;
  document.getElementById('waitTime').textContent=w?'~'+Math.ceil(w*avg/n):'0';
});
document.getElementById('takeBtn').onclick=async()=>{
  if(busy)return; busy=true;
  const t=await takeTicket(); busy=false;
  document.getElementById('newTicket').textContent=t.label;
  document.getElementById('note').textContent=STATE.settings.note;
  document.getElementById('result').style.display='flex';
  document.getElementById('printArea').innerHTML=`
    <div class="t-head">
      <img src="img/logo.png" onerror="this.style.display='none'">
      <div>
        <div class="t-school-zh">觀塘瑪利諾書院</div>
        <div class="t-school-en">KWUN TONG MARYKNOLL COLLEGE</div>
      </div>
    </div>
    <div class="t-center">
      <div class="t-title">號碼票</div>
      <div class="t-title-en">QUEUE TICKET</div>
      <div class="t-num">${t.label}</div>
      <div class="t-row">(發行 Issue: ${t.time})</div>
      <div class="t-row">時段 Session: ${STATE.session.prefix}</div>
    </div>
    <div class="t-note">
      請保留此籌號，並留意大屏幕廣播。<br>
      Please keep this ticket and wait for the display announcement.<br>
      如叫號時不在現場，將順延至下一位。<br>
      If you are not present when called, your number will be passed to the next.
    </div>`;
  setTimeout(()=>{ window.print(); },200);
  setTimeout(()=>document.getElementById('result').style.display='none',6000);
};
</script>
</body></html>
