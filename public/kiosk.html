<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiosk 取號</title><link rel="stylesheet" href="css/style.css">
<style>
.kiosk-wrap{min-height:calc(100vh - 64px); display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:22px; padding:20px; text-align:center}
.k-hero-title{font-size:clamp(26px,4vw,44px); font-weight:800; letter-spacing:1px}
.k-hero-sub{font-size:clamp(15px,2vw,20px); color:var(--muted); margin-top:4px}
#takeBtn{width:min(560px,90vw); height:min(420px,52vh); border-radius:36px;
  font-size:clamp(28px,4vw,46px); line-height:1.3; font-weight:800;
  background:linear-gradient(160deg,#3b82f6,#1e3a8a); box-shadow:0 18px 50px rgba(30,64,175,.45);
  animation:breath 2.6s ease-in-out infinite}
.k-stats{display:flex; gap:14px; flex-wrap:wrap; justify-content:center}
.k-stat{background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px 18px;
  font-weight:700; box-shadow:var(--shadow); font-size:18px}
.k-stat small{display:block; font-weight:600; color:var(--muted); font-size:12px; margin-bottom:2px}
.k-note{max-width:640px; color:var(--muted); line-height:1.7; font-size:14px}
.k-ticket-card{background:#fff; border:2px dashed #94a3b8; border-radius:20px; padding:26px 52px;
  box-shadow:var(--shadow)}
.k-ticket-card .t-label{font-size:13px; font-weight:700; color:var(--muted); letter-spacing:3px}
.k-ticket-card .t-num{font-size:clamp(72px,12vw,140px); font-weight:800; line-height:1.05;
  background:linear-gradient(135deg,#1d4ed8,#60a5fa); -webkit-background-clip:text; background-clip:text; color:transparent}
.k-ticket-card .t-meta{font-size:14px; color:var(--muted); font-weight:600; margin-top:4px}
.k-back{font-size:13px; color:var(--muted)}
.rp-chip{background:#f1f5f9; color:var(--text); box-shadow:none; padding:10px 16px; font-size:16px; border-radius:10px}
.rp-chip:hover{background:#e2e8f0}
.rp-ticket{background:#fff; border:1.5px dashed #94a3b8; border-radius:12px; padding:16px;
  font-size:13px; line-height:1.7; color:#000; text-align:left}
.rp-ticket .badge{display:inline-block; border:1px solid #000; padding:2px 8px; font-weight:700; margin-bottom:8px}
.rp-ticket .num{font-size:48px; font-weight:800; text-align:center; margin:6px 0; letter-spacing:2px}
.rp-ticket .center{text-align:center}
.rp-ticket .b{font-weight:700}
@media (max-width:640px){
  #takeBtn{height:min(300px,44vh); border-radius:26px}
  .k-ticket-card{padding:18px 28px}
  .k-stat{font-size:15px; padding:8px 14px}
}
</style>
</head><body>
<div class="topbar"><span id="title">Kiosk 取號</span><span class="chip" id="sessChip"></span></div>

<div class="kiosk-wrap" id="homeView">
  <div>
    <div class="k-hero-title" id="heroTitle"></div>
    <div class="k-hero-sub" id="heroSub"></div>
  </div>
  <button id="takeBtn">TAKE A TICKET<br>取 號</button>
  <div class="k-stats">
    <div class="k-stat"><small>Waiting 等候中</small><span id="statWait">0</span> 人</div>
    <div class="k-stat"><small>Est. wait 預計等候</small><span id="statEst">—</span></div>
  </div>
  <button id="btnReprint" class="btn-gray">REPRINT<br><span class="hk">重印小票</span></button>
  <div class="k-note" id="note"></div>
</div>

<div class="kiosk-wrap" id="ticketView" style="display:none">
  <div class="k-hero-title">Your Ticket 你的籌號</div>
  <div class="k-ticket-card">
    <div class="t-label">TICKET 籌號</div>
    <div class="t-num" id="tvNum">A001</div>
    <div class="t-meta" id="tvMeta"></div>
  </div>
  <div class="k-stats">
    <div class="k-stat"><small>Ahead 你前面</small><span id="tvAhead">0</span> 人</div>
    <div class="k-stat"><small>Est. wait 預計等候</small><span id="tvEst">—</span></div>
  </div>
  <div class="k-note">Please keep this ticket and watch for the display announcement. 請保留此籌號，並留意大屏幕廣播。</div>
  <div class="k-back" id="backCount"></div>
</div>

<div class="kiosk-wrap" id="reprintView" style="display:none">
  <div class="k-hero-title">Reprint 重印小票</div>
  <div class="card" id="rpLock" style="max-width:380px; width:100%; text-align:center">
    <p class="muted" style="margin-bottom:10px">Admin password required 需要管理員密碼</p>
    <input type="password" id="rpPw" placeholder="Password 密碼">
    <div class="row" style="margin-top:12px; justify-content:center">
      <button id="rpUnlock">Unlock 解鎖</button>
      <button id="rpBack1" class="btn-gray">Back 返回</button>
    </div>
    <p id="rpErr" style="color:#dc2626; font-weight:600; margin-top:8px"></p>
  </div>
  <div class="card" id="rpList" style="display:none; max-width:760px; width:100%; max-height:62vh; overflow:auto; text-align:left">
    <h3 style="border:none; padding:0; margin-bottom:10px">Choose ticket 選擇要重印嘅籌號</h3>
    <div id="rpItems" style="display:flex; flex-wrap:wrap; gap:8px"></div>
    <div class="row" style="margin-top:14px"><button id="rpBack2" class="btn-gray">Back 返回</button></div>
  </div>
  <div class="card" id="rpPreview" style="display:none; max-width:420px; width:100%">
    <div id="rpPrevBody"></div>
    <div class="row" style="margin-top:14px; justify-content:center">
      <button id="rpPrint" class="btn-green">Print 確定列印</button>
      <button id="rpBack3" class="btn-gray">Back 返回</button>
    </div>
  </div>
</div>

<div id="printArea"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/config.js"></script><script src="js/common.js"></script>
<script>
const $ = id => document.getElementById(id);
const ADMIN_PW = 'ktmc2026';   // ← 與 admin 相同密碼
let busy = false, backTimer = null, takenNo = null, shownAt = 0, rpTicket = null;

/* 點擊／觸碰任何位置 → 返回首頁（只限取號票畫面） */
document.addEventListener('pointerdown', () => {
  if (takenNo != null && Date.now() - shownAt > 1500) goHome();
});

onState(s => {
  $('title').innerHTML = `${s.settings.title} <span class="hk">${s.settings.subtitle}</span>`;
  $('sessChip').textContent = 'Session 時段 ' + s.session.prefix;
  $('heroTitle').textContent = s.settings.title;
  $('heroSub').textContent = s.settings.subtitle;
  $('note').textContent = s.settings.note;

  const w = waiting();
  const counters = (s.settings.counters || []).length || 1;
  const avg = s.settings.avgMinutes || 3;
  $('statWait').textContent = w.length;
  $('statEst').textContent = Math.ceil(w.length * avg / counters) + ' min';
  if (takenNo != null){
    const ahead = w.filter(t => t.no < takenNo).length;
    $('tvAhead').textContent = ahead;
    $('tvEst').textContent = Math.ceil(ahead * avg / counters) + ' min';
  }
});

/* ===== 小票模板 ===== */
function ticketHTML(t, reprint){
  return `
    ${reprint ? '<div class="t-reprint">Reprinted 重新列印</div>' : ''}
    <div class="t-head">
      <img src="img/logo.png" alt="logo">
      <div>
        <div class="t-school-zh">觀塘瑪利諾書院</div>
        <div class="t-school-en">KWUN TONG MARYKNOLL COLLEGE</div>
      </div>
    </div>
    <div class="t-center">
      <div class="t-title">號碼票</div>
      <div class="t-title-en">QUEUE TICKET</div>
      <div class="t-num">${t.label}</div>
      <div class="t-row">發行時間 Issuing Time: ${t.time}</div>
      ${reprint ? `<div class="t-row">重印時間 Reprint Time: ${nowLabel()}</div>` : ''}
      <div class="t-row">時段 Session: ${STATE.session.prefix}</div>
    </div>
    <div class="t-note">
      請保留此籌號，並留意大屏幕廣播。<br>
      Please keep this ticket and wait for the display announcement.<br>
      如叫號時不在現場，將順延至下一位。<br>
      If you are not present when called, your number will be passed to the next.
    </div>`;
}

/* 按紙張設定打印 */
function setPrint(t, reprint){
  const pa = $('printArea');
  pa.className = (STATE.settings.paper === '58') ? 'p58' : '';
  pa.innerHTML = ticketHTML(t, reprint);
  setTimeout(() => window.print(), 300);
}

/* ===== 取號 ===== */
$('takeBtn').onclick = async () => {
  if (busy) return; busy = true;
  const t = await takeTicket();
  takenNo = t.no;
  shownAt = Date.now();

  $('tvNum').textContent = t.label;
  $('tvMeta').textContent = `Session ${STATE.session.prefix} · ${t.time}`;
  $('homeView').style.display = 'none';
  $('ticketView').style.display = 'flex';

  setPrint(t, false);

  let sec = 10;
  $('backCount').textContent = `Tap anywhere to return 點擊任意位置返回 · ${sec}s`;
  clearInterval(backTimer);
  backTimer = setInterval(() => {
    sec--;
    $('backCount').textContent = `Tap anywhere to return 點擊任意位置返回 · ${sec}s`;
    if (sec <= 0) goHome();
  }, 1000);
  busy = false;
};

function goHome(){
  clearInterval(backTimer);
  takenNo = null;
  $('ticketView').style.display = 'none';
  $('reprintView').style.display = 'none';
  $('homeView').style.display = 'flex';
}

/* ===== 重印 ===== */
$('btnReprint').onclick = () => {
  $('homeView').style.display = 'none';
  $('reprintView').style.display = 'flex';
  $('rpLock').style.display = 'block';
  $('rpList').style.display = 'none';
  $('rpPreview').style.display = 'none';
  $('rpPw').value = '';
  $('rpErr').textContent = '';
};
$('rpBack1').onclick = goHome;
$('rpBack2').onclick = goHome;
$('rpBack3').onclick = () => {
  $('rpPreview').style.display = 'none';
  $('rpList').style.display = 'block';
};
$('rpUnlock').onclick = () => {
  if ($('rpPw').value === ADMIN_PW){
    $('rpLock').style.display = 'none';
    $('rpList').style.display = 'block';
    renderRpList();
  } else {
    $('rpErr').textContent = 'Wrong password 密碼錯誤';
  }
};
$('rpPw').addEventListener('keydown', e => { if (e.key === 'Enter') $('rpUnlock').onclick(); });

function renderRpList(){
  const ts = ticketsArr().sort((a,b) => b.no - a.no).slice(0, 60);
  $('rpItems').innerHTML = ts.map(t =>
    `<button class="rp-chip" data-k="${t.key}">${t.label}</button>`
  ).join('') || '<p class="muted">No tickets 暫無籌號</p>';
}

/* 揀號碼 → 預覽 */
$('rpItems').onclick = e => {
  const k = e.target.dataset.k; if (!k) return;
  const t = ticketsArr().find(x => x.key === k); if (!t) return;
  rpTicket = t;
  $('rpPrevBody').innerHTML = `
    <div class="rp-ticket">
      <div class="badge">Reprinted 重新列印</div>
      <div class="center b">觀塘瑪利諾書院</div>
      <div class="center" style="font-size:11px">KWUN TONG MARYKNOLL COLLEGE</div>
      <div class="center" style="margin-top:6px">號碼票 QUEUE TICKET</div>
      <div class="num">${t.label}</div>
      <div>發行時間 Issuing Time: ${t.time}</div>
      <div>重印時間 Reprint Time: ${nowLabel()}</div>
      <div>時段 Session: ${STATE.session.prefix}</div>
    </div>`;
  $('rpList').style.display = 'none';
  $('rpPreview').style.display = 'block';
};

/* 確定先列印 */
$('rpPrint').onclick = () => {
  if (!rpTicket) return;
  setPrint(rpTicket, true);
};
</script>
</body></html>
